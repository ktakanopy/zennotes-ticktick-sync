[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zennotes-ticktick-sync"
version = "0.1.0"
description = "Safe bidirectional synchronization between ZenNotes Markdown tasks and TickTick"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2,<3",
]

[project.scripts]
ztsync = "ztsync.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ztsync"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
